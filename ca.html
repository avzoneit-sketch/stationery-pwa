<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stationery Request - CA</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .user-bar {
            max-width: 700px;
            margin: 0 auto;
            padding: 10px 20px 0;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;
        }

        .user-info {
            font-size: 14px;
            color: #374151;
            word-break: break-word;
        }

        .logout-button {
            width: auto;
            flex: none;

            padding: 8px 14px;
            margin: 0;

            background: #dc2626;

            font-size: 14px;

            white-space: nowrap;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .request {
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .request:last-child {
            border-bottom: none;
        }

        .request-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .request-info {
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .approve {
            background: #16a34a;
        }

        .reject {
            background: #dc2626;
        }

        button:disabled {
            background: #9ca3af;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
        }

        .refresh {
            background: #2563eb;
            width: 100%;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>Stationery Request - CA</h1>

</header>


<!-- ========================= -->
<!-- CA User Bar -->
<!-- ========================= -->

<div class="user-bar">

    <div
        id="userInfo"
        class="user-info">

        กำลังตรวจสอบผู้ใช้...

    </div>


    <button
        id="logoutButton"
        class="logout-button"
        onclick="logout()">

        ออกจากระบบ

    </button>

</div>


<div class="container">


    <div class="card">

        <h2>คำขอรออนุมัติ</h2>


        <button
            class="refresh"
            onclick="loadRequests()">

            รีเฟรชรายการ

        </button>


        <div id="requestList">

            <div class="empty">

                กำลังโหลด...

            </div>

        </div>

    </div>


</div>


<!-- ================================= -->
<!-- Supabase -->
<!-- ================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =================================
    // Supabase Configuration
    // =================================

    const SUPABASE_URL =
        "https://bufdbnwklodtylfymxsr.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable__17NzdoVhyxrq9dvMATssA_kXFpX7_R";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // =================================
    // ตรวจสอบ Login + Role
    // =================================

    async function checkCAAccess() {

        try {

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (sessionError) {

                throw sessionError;

            }


            const session =
                sessionData.session;


            // =================================
            // ไม่มี Login
            // =================================

            if (!session) {

                window.location.href =
                    "./login.html";

                return false;

            }


            const user =
                session.user;


            // =================================
            // อ่าน Profile
            // =================================

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "display_name, role, department"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (profileError) {

                throw profileError;

            }


            // =================================
            // User ห้ามเข้า CA
            // =================================

            if (profile.role === "User") {

                window.location.href =
                    "./index.html";

                return false;

            }


            // =================================
            // ต้องเป็น CA เท่านั้น
            // =================================

            if (profile.role !== "CA") {

                await supabaseClient
                    .auth
                    .signOut();

                window.location.href =
                    "./login.html";

                return false;

            }


            // =================================
            // แสดงข้อมูล CA
            // =================================

            document
                .getElementById("userInfo")
                .textContent =
                    profile.display_name +
                    " | " +
                    profile.department;


            return true;

        }
        catch (error) {

            console.error(
                "CA access check error:",
                error
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "./login.html";

            return false;

        }

    }


    // =================================
    // Logout
    // =================================

    async function logout() {

        const {
            error
        } =
            await supabaseClient
                .auth
                .signOut();


        if (error) {

            console.error(error);

            alert(
                "ไม่สามารถออกจากระบบได้: " +
                error.message
            );

            return;

        }


        window.location.href =
            "./login.html";

    }


    // =================================
    // โหลดคำขอ Pending
    // =================================

    async function loadRequests() {

        const list =
            document.getElementById("requestList");


        list.innerHTML = `
            <div class="empty">
                กำลังโหลด...
            </div>
        `;


        const { data, error } =
            await supabaseClient
                .from("requests")
                .select("*")
                .eq("status", "Pending")
                .order("created_at", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            list.innerHTML = `
                <div class="error">
                    ไม่สามารถโหลดข้อมูลได้:
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;
        }


        if (!data || data.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    ไม่มีคำขอที่รออนุมัติ
                </div>
            `;

            return;
        }


                // =================================
        // โหลดข้อมูล Profile ของผู้ขอ
        // =================================

        const userIds = [
            ...new Set(
                data
                    .map(request => request.user_id)
                    .filter(Boolean)
            )
        ];


        let profiles = [];


        if (userIds.length > 0) {

            const {
                data: profileData,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "id, display_name, department"
                    )
                    .in("id", userIds);


            if (profileError) {

                console.error(profileError);

                list.innerHTML = `
                    <div class="error">
                        ไม่สามารถโหลดข้อมูลผู้ขอได้:
                        ${escapeHtml(profileError.message)}
                    </div>
                `;

                return;

            }


            profiles = profileData || [];

        }


        // =================================
        // สร้าง Map สำหรับค้นหา Profile
        // =================================

        const profileMap =
            new Map(
                profiles.map(profile => [
                    profile.id,
                    profile
                ])
            );


        list.innerHTML = "";


        data.forEach(request => {

            const profile =
                profileMap.get(request.user_id);


            const requesterName =
                profile?.display_name || "-";


            const department =
                profile?.department || "-";


            const item =
                document.createElement("div");


            item.className = "request";


            item.innerHTML = `

                <div class="request-title">

                    ${escapeHtml(request.item_name)}

                </div>


                <div class="request-info">

                    จำนวน:
                    ${request.quantity}

                    <br>

                    ผู้ขอ:
                    ${escapeHtml(requesterName)}

                    <br>

                    แผนก:
                    ${escapeHtml(department)}

                    <br>

                    วันที่:
                    ${formatDate(request.created_at)}

                    <br>

                    สถานะ:
                    ${escapeHtml(request.status)}

                </div>


                <div class="buttons">

                    <button
                        class="approve"
                        onclick="updateRequest(
                            ${request.id},
                            'Approved'
                        )">

                        อนุมัติ

                    </button>


                    <button
                        class="reject"
                        onclick="updateRequest(
                            ${request.id},
                            'Rejected'
                        )">

                        ไม่อนุมัติ

                    </button>

                </div>

            `;


            list.appendChild(item);

        });

    }


    // =================================
    // อนุมัติ / ไม่อนุมัติ
    // =================================

    async function updateRequest(
        id,
        newStatus
    ) {

        const message =
            newStatus === "Approved"
                ? "ยืนยันการอนุมัติคำขอนี้หรือไม่?"
                : "ยืนยันการไม่อนุมัติคำขอนี้หรือไม่?";


        if (!confirm(message)) {

            return;

        }


        const buttons =
            document.querySelectorAll(
                `button[onclick*="${id}"]`
            );


        buttons.forEach(button => {

            button.disabled = true;

        });


        const { error } =
            await supabaseClient
                .from("requests")
                .update({
                    status: newStatus,
                    approved_by: "CA",
                    approved_at: new Date().toISOString()
                })
                .eq("id", id)
                .eq("status", "Pending");


        if (error) {

            console.error(error);

            alert(
                "ไม่สามารถเปลี่ยนสถานะได้:\n" +
                error.message
            );

            loadRequests();

            return;
        }


        alert(
            newStatus === "Approved"
                ? "อนุมัติเรียบร้อย"
                : "ไม่อนุมัติเรียบร้อย"
        );


        await loadRequests();

    }


    // =================================
    // ป้องกัน HTML Injection
    // =================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // =================================
    // แสดงวันที่
    // =================================

    function formatDate(value) {

        if (!value) {

            return "-";

        }


        return new Date(value)
            .toLocaleString("th-TH");

    }


    // =================================
    // เริ่มต้นระบบ
    // =================================

    async function initializeCA() {

        const accessGranted =
            await checkCAAccess();


        if (!accessGranted) {

            return;

        }


        // =================================
        // โหลดคำขอหลังตรวจสิทธิ์แล้วเท่านั้น
        // =================================

        loadRequests();

    }


    // =================================
    // Start
    // =================================

    initializeCA();

</script>


</body>

</html>
