<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stationery Request</title>

    <link rel="manifest" href="./manifest.json">

    <link rel="apple-touch-icon"
          href="./icon-192.png">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .user-bar {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            font-size: 14px;
            color: #374151;
            word-break: break-word;
        }

        .logout-button {
            width: auto;
            padding: 8px 14px;
            margin: 0;
            background: #dc2626;
            font-size: 14px;
            white-space: nowrap;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            background: #9ca3af;
        }

        .item {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
        }

    </style>

</head>


<body>

<header>

    <h1>Stationery Request</h1>

</header>


<!-- ========================= -->
<!-- User Bar -->
<!-- ========================= -->

<div class="user-bar">

    <div
        id="userInfo"
        class="user-info">
        กำลังตรวจสอบผู้ใช้...
    </div>

    <button
        id="logoutButton"
        class="logout-button"
        onclick="logout()">

        ออกจากระบบ

    </button>

</div>


<div class="container">


    <!-- ========================= -->
    <!-- สร้างคำขอ -->
    <!-- ========================= -->

    <div class="card">

        <h2>สร้างคำขอ</h2>


        <label>รายการ</label>

        <input
            id="itemName"
            type="text"
            placeholder="เช่น ปากกา">


        <label>จำนวน</label>

        <input
            id="quantity"
            type="number"
            value="1"
            min="1">


        <button
            id="submitButton"
            onclick="addRequest()">

            ส่งคำขอ

        </button>


        <div
            id="errorMessage"
            class="error">
        </div>

    </div>


    <!-- ========================= -->
    <!-- รายการคำขอ -->
    <!-- ========================= -->

    <div class="card">

        <h2>รายการคำขอ</h2>

        <div id="requestList">

            <div class="empty">
                กำลังโหลด...
            </div>

        </div>

    </div>


</div>


<!-- ================================= -->
<!-- Supabase -->
<!-- ================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =================================
    // Supabase Configuration
    // =================================

    const SUPABASE_URL =
        "https://bufdbnwklodtylfymxsr.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable__17NzdoVhyxrq9dvMATssA_kXFpX7_R";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // =================================
    // ตรวจสอบ Login + Role
    // =================================

    async function checkUserAccess() {

        try {

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (sessionError) {

                throw sessionError;

            }


            const session =
                sessionData.session;


            // =================================
            // ไม่มี Login
            // =================================

            if (!session) {

                window.location.href =
                    "./login.html";

                return false;

            }


            const user =
                session.user;


            // =================================
            // อ่าน Profile
            // =================================

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "display_name, role, department"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (profileError) {

                throw profileError;

            }


            // =================================
            // CA ห้ามเข้า User Page
            // =================================

            if (profile.role === "CA") {

                window.location.href =
                    "./ca.html";

                return false;

            }


            // =================================
            // ต้องเป็น User เท่านั้น
            // =================================

            if (profile.role !== "User") {

                await supabaseClient
                    .auth
                    .signOut();

                window.location.href =
                    "./login.html";

                return false;

            }


            // =================================
            // แสดงข้อมูลผู้ใช้
            // =================================

            document
                .getElementById("userInfo")
                .textContent =
                    profile.display_name +
                    " | " +
                    profile.department;


            return true;

        }
        catch (error) {

            console.error(
                "Access check error:",
                error
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "./login.html";

            return false;

        }

    }


    // =================================
    // Logout
    // =================================

    async function logout() {

        const {
            error
        } =
            await supabaseClient
                .auth
                .signOut();


        if (error) {

            console.error(error);

            alert(
                "ไม่สามารถออกจากระบบได้: " +
                error.message
            );

            return;

        }


        window.location.href =
            "./login.html";

    }


    // =================================
    // เพิ่มคำขอ
    // =================================

    async function addRequest() {

        const itemName =
            document.getElementById("itemName")
                .value
                .trim();


        const quantity =
            parseInt(
                document.getElementById("quantity").value
            );


        const button =
            document.getElementById("submitButton");


        const errorMessage =
            document.getElementById("errorMessage");


        errorMessage.textContent = "";


        // ตรวจสอบรายการ

        if (!itemName) {

            alert("กรุณาระบุรายการ");

            return;
        }


        // ตรวจสอบจำนวน

        if (!quantity || quantity < 1) {

            alert("กรุณาระบุจำนวนให้ถูกต้อง");

            return;
        }


        // ป้องกันกดซ้ำ

        button.disabled = true;

        button.textContent = "กำลังส่ง...";


        try {

            const {
    data: { user },
    error: userError
} = await supabaseClient.auth.getUser();


if (userError || !user) {

    throw new Error(
        "ไม่พบผู้ใช้งาน กรุณา Login ใหม่"
    );

}


const { data, error } =
    await supabaseClient
        .from("requests")
        .insert([
            {
                item_name: itemName,
                quantity: quantity,
                user_id: user.id
            }
        ])
        .select();


            if (error) {

                console.error(error);

                throw error;
            }


            // ล้างช่องกรอก

            document.getElementById("itemName")
                .value = "";

            document.getElementById("quantity")
                .value = 1;


            // โหลดรายการใหม่

            await loadRequests();


            alert("ส่งคำขอเรียบร้อย");


        }
        catch (error) {

            console.error(error);

            errorMessage.textContent =
                "ไม่สามารถส่งคำขอได้: " +
                error.message;

        }
        finally {

            button.disabled = false;

            button.textContent = "ส่งคำขอ";

        }

    }


    // =================================
    // โหลดรายการคำขอ
    // =================================

    async function loadRequests() {

        const list =
            document.getElementById("requestList");


        const { data, error } =
            await supabaseClient
                .from("requests")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            list.innerHTML = `
                <div class="error">
                    ไม่สามารถโหลดข้อมูลได้
                </div>
            `;

            return;
        }


        if (!data || data.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    ยังไม่มีรายการคำขอ
                </div>
            `;

            return;
        }


        list.innerHTML = "";


        data.forEach(request => {

            const item =
                document.createElement("div");


            item.className = "item";


            item.innerHTML = `
                <strong>
                    ${escapeHtml(request.item_name)}
                </strong>

                <br>

                จำนวน:
                ${request.quantity}

                <br>

                สถานะ:
                ${escapeHtml(request.status)}

                <br>

                วันที่:
                ${formatDate(request.created_at)}
            `;


            list.appendChild(item);

        });

    }


    // =================================
    // ป้องกัน HTML Injection
    // =================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // =================================
    // แสดงวันที่
    // =================================

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        return new Date(value)
            .toLocaleString("th-TH");

    }


    // =================================
    // เริ่มระบบ
    // =================================

    async function initializeApp() {

        const accessGranted =
            await checkUserAccess();


        if (!accessGranted) {

            return;

        }


        // =================================
        // โหลดข้อมูลเมื่อเปิดหน้า
        // =================================

        loadRequests();


        // =================================
        // Supabase Realtime
        // =================================

        supabaseClient
            .channel("requests-realtime")
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "requests"
                },
                (payload) => {

                    console.log(
                        "Realtime update:",
                        payload
                    );

                    loadRequests();

                }
            )
            .subscribe();

    }


    // =================================
    // เริ่มต้น
    // =================================

    initializeApp();

</script>


<!-- ================================= -->
<!-- Service Worker -->
<!-- ================================= -->

<script>

    if ("serviceWorker" in navigator) {

        navigator.serviceWorker.register("./sw.js");

    }

</script>


</body>

</html>
